name: Scraper image

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scraper-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Dockerfile launches Chromium during the build, so a Playwright
      # npm/Docker image mismatch fails here instead of on Dokploy.
      - name: Build scraper image
        run: docker build -f packages/scraper/Dockerfile .
